name: Deploy Rice API

on:
  push:
    branches: [ main ]  # ເມື່ອ Push ຂຶ້ນ Branch main ມັນຈະເຮັດວຽກທັນທີ

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@master
        with:
          host: 62.171.159.75
          username: root
          password: ${{ secrets.VPS_PASSWORD }} # ເຮົາຈະໄປຕັ້ງໃນ GitHub Settings
          script: |
            cd /var/www/myshop/rice-api
            git pull origin main
            go build -o main .
            # ຖ້າເຈົ້າໃຊ້ systemd ສາມາດສັ່ງ restart ໄດ້ບ່ອນນີ້ ເຊັ່ນ: systemctl restart rice-api